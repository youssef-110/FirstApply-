<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firstapply: student jobs in Germany, the moment they're posted</title>
  <meta name="description" content="Working student jobs, internships and theses across Germany. Filter by city, field and language, and get an email with the apply link as soon as a new job is posted.">
  <meta name="theme-color" content="#2347D9">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/jobs" aria-label="Firstapply home">
        <img src="/logo.svg" width="30" height="30" alt="">
        <span>Firstapply</span>
      </a>
      <form class="search" id="search-form" role="search">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
          <input id="q" name="q" type="search" placeholder="Title, skill or company" autocomplete="off" aria-label="Title, skill or company">
        </label>
        <label class="search-field search-loc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7Zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
          <input id="loc" name="loc" type="text" placeholder="City" list="city-list" autocomplete="off" aria-label="City">
          <datalist id="city-list"></datalist>
        </label>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <nav class="tabs" aria-label="Main">
        <a href="#/jobs" data-tab="jobs">Jobs</a>
        <a href="#/saved" data-tab="saved" data-owner>Saved <span class="count" id="count-saved"></span></a>
        <a href="#/applied" data-tab="applied" data-owner>Applied <span class="count" id="count-applied"></span></a>
        <a href="#/alerts" data-tab="alerts" data-owner>Alerts</a>
      </nav>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm-1-5h2v3h-2V2Zm0 17h2v3h-2v-3ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1Zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1ZM18.4 4.2l1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1ZM6.3 16.3l1.4 1.4-2.1 2.1-1.4-1.4 2.1-2.1Z"/></svg>
        </button>
        <button type="button" class="btn btn-sm" id="sign-in" hidden>Sign in</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="toast-region" aria-live="polite" id="toasts"></div>
  <dialog id="modal" class="modal"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
